<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hodor telemetry dashboard</title>
<style>
  /* Visual style aligned with Atlas (atlas.plainconcepts.com): Geist type, oklch palette, soft cards. */
  :root {
    --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", "JetBrains Mono", monospace;
    --bg: oklch(98.5% .003 250);
    --bg-muted: oklch(96.5% .004 250);
    --surface: #fff;
    --surface-3: oklch(97% .005 250);
    --border: oklch(91% .005 258);
    --border-strong: oklch(85% .008 258);
    --fg: oklch(22% .02 258);
    --fg-2: oklch(36% .02 258);
    --fg-muted: oklch(52% .015 258);
    --fg-subtle: oklch(65% .012 258);
    --brand: oklch(45% .13 258); --brand-hover: oklch(40% .13 258);
    --brand-soft: oklch(96% .02 258); --brand-border: oklch(88% .04 258);
    --danger: oklch(52% .18 25); --danger-soft: oklch(96% .04 25); --danger-border: oklch(86% .07 25);
    --orange: oklch(62% .16 52); --orange-soft: oklch(95% .05 52); --orange-text: oklch(46% .16 52); --orange-border: oklch(85% .09 52);
    --warn: oklch(62% .13 75); --warn-soft: oklch(95% .05 75); --warn-text: oklch(42% .13 75); --warn-border: oklch(85% .08 75);
    --info: oklch(52% .13 230); --info-soft: oklch(95% .04 230); --info-border: oklch(85% .05 230);
    --violet: oklch(50% .16 305); --violet-soft: oklch(95% .04 305);
    --r-2: 6px; --r-3: 8px; --r-4: 10px;
    --sh-1: 0 1px 0 #1418240a, 0 1px 2px #1418240a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: var(--font-sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 24px 64px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 2px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  h1 .brandmark { color: var(--brand); }
  .sub { color: var(--fg-muted); font-size: 13px; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: var(--font-mono); font-size: 12px; }

  #drop { display: block; margin: 18px 0; border: 1.5px dashed var(--border-strong); border-radius: var(--r-4);
    background: var(--surface); padding: 22px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  #drop.drag { border-color: var(--brand); background: var(--brand-soft); }
  #drop .big { font-weight: 600; }
  #drop .hint { color: var(--fg-muted); font-size: 12.5px; margin-top: 6px; word-break: break-all; }
  #drop input { display: none; }

  #progressWrap { display: none; margin: 12px 0; }
  #progressWrap.on { display: block; }
  .bar { height: 8px; background: var(--bg-muted); border-radius: 999px; overflow: hidden; }
  .bar > span { display: block; height: 100%; width: 0; background: var(--brand); transition: width .1s linear; }
  #progressMsg { color: var(--fg-muted); font-size: 12.5px; margin-top: 6px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 14px 0 4px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-4); padding: 14px 16px; box-shadow: var(--sh-1); }
  .tile .k { color: var(--fg-muted); font-size: 12px; }
  .tile .v { font-size: 26px; font-weight: 600; margin-top: 4px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .v.small { font-size: 15px; letter-spacing: 0; }

  section.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-4);
    padding: 16px 18px; margin: 16px 0; box-shadow: var(--sh-1); }
  section.panel h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  section.panel h2 .count { color: var(--fg-muted); font-weight: 400; font-size: 13px; }

  .sevrow { display: grid; grid-template-columns: 92px 1fr 48px; align-items: center; gap: 12px; margin: 9px 0; }
  .sevrow .lbl { font-weight: 500; text-transform: capitalize; color: var(--fg-2); }
  .sevrow .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .track { background: var(--bg-muted); border-radius: 999px; height: 18px; overflow: hidden; }
  .track > span { display: block; height: 100%; border-radius: 999px; }
  .s-critical > span { background: var(--danger); }
  .s-high > span { background: var(--orange); }
  .s-medium > span { background: var(--warn); }
  .s-other > span { background: var(--fg-subtle); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--fg-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface-3); }
  .barcell { position: relative; min-width: 140px; }
  .barcell .b { position: absolute; left: 0; top: 4px; bottom: 4px; background: var(--brand-soft); border-radius: var(--r-2); }
  .barcell .t { position: relative; padding-left: 8px; font-variant-numeric: tabular-nums; }

  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; border: 1px solid transparent; }
  .pill.skill, .pill.plainconcepts { color: var(--brand); background: var(--brand-soft); border-color: var(--brand-border); }
  .pill.agent { color: var(--violet); background: var(--violet-soft); }
  .pill.command { color: var(--info); background: var(--info-soft); border-color: var(--info-border); }
  .pill.plugin { color: var(--info); background: var(--info-soft); border-color: var(--info-border); }
  .pill.personal, .pill.external, .pill.unknown { color: var(--fg-muted); background: var(--bg-muted); }
  .pill.s-critical { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-border); }
  .pill.s-high { color: var(--orange-text); background: var(--orange-soft); border-color: var(--orange-border); }
  .pill.s-medium { color: var(--warn-text); background: var(--warn-soft); border-color: var(--warn-border); }
  .pill.s-other { color: var(--fg-muted); background: var(--bg-muted); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { background: var(--bg-muted); border-radius: 999px; padding: 3px 11px; font-size: 12px; color: var(--fg-2); }
  .chip b { font-variant-numeric: tabular-nums; color: var(--fg); }
  .muted { color: var(--fg-muted); }
  .empty { color: var(--fg-muted); text-align: center; padding: 34px; }
  .tblwrap { overflow-x: auto; }
  footer { margin-top: 28px; color: var(--fg-subtle); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="brandmark">Hodor</span> telemetry</h1>
    <span class="sub">policy findings by severity, skills &amp; agents by usage</span>
  </header>

  <label id="drop">
    <div class="big">Drop your log file here, or click to choose</div>
    <div class="hint">Default location: <code id="logpath">%LOCALAPPDATA%\PlainConcepts\ai-hooks\logs\telemetry-queue.jsonl</code><br>
      You can also drop <code>security.jsonl</code> and <code>hooks-error.jsonl</code> together. Everything stays in your browser.</div>
    <input id="file" type="file" accept=".jsonl,.json,.log,.txt" multiple>
  </label>

  <div id="progressWrap">
    <div class="bar"><span id="progressBar"></span></div>
    <div id="progressMsg"></div>
  </div>

  <div id="content"></div>

  <footer>Read-only · offline · nothing leaves this page. Reload to clear.</footer>
</div>

<script>
"use strict";

// ---------- Parsing / normalization ----------
function normalizeRecord(o) {
  if (!o || typeof o !== "object") return null;

  // Top-level event (security.jsonl / hooks-error.jsonl)
  if (o.event) {
    const ev = String(o.event);
    const type = ev.indexOf("policy") === 0 ? "policy" : (ev === "hook_issue" ? "error" : null);
    if (!type) return null;
    return { origin: "log", type, ts: o.ts || null,
      rule: o.rule || null, severity: lc(o.severity), action: o.action || null,
      agent: o.agent || null, error: o.error || null, version: o.version || null,
      skill: null, plugin: null, source: null, kind: null };
  }

  // OTel record: PS uses {name, attributes:{...}}, bash uses {body:{stringValue}, attributes:[{key,value}]}
  const name = o.name || (o.body && o.body.stringValue) || null;
  if (!name) return null;
  let attrs = {};
  if (o.attributes && !Array.isArray(o.attributes)) attrs = o.attributes;
  else if (Array.isArray(o.attributes)) {
    for (const a of o.attributes) {
      if (a && a.key) attrs[a.key] = (a.value && a.value.stringValue !== undefined) ? a.value.stringValue : (a.value != null ? a.value : "");
    }
  }
  const g = k => (attrs[k] !== undefined ? attrs[k] : null);
  const type = name.indexOf("policy") >= 0 ? "policy"
             : name.indexOf("skill_usage") >= 0 ? "skill"
             : name.indexOf("inventory") >= 0 ? "inventory"
             : name.indexOf("hook_issue") >= 0 ? "error" : null;
  if (!type) return null;
  const ts = o.ts || (o.timeUnixNano && Number(o.timeUnixNano) > 1e12 ? new Date(Number(o.timeUnixNano) / 1e6).toISOString() : null);
  const ev = { origin: "otel", type, ts,
    rule: g("pc.rule"), severity: lc(g("pc.severity")), action: g("pc.action"),
    agent: g("pc.agent"), error: g("pc.error"), version: g("pc.hooks_version"),
    skill: g("pc.skill"), plugin: g("pc.plugin"), source: g("pc.source"), kind: g("pc.kind") };
  if (type === "inventory") {
    Object.assign(ev, { user: g("pc.user") || g("pc.user_hash") || "?", client: g("pc.client"), snapshot: g("pc.inventory_id"),
      pluginVersion: g("pc.plugin_version"), marketplace: g("pc.marketplace"), enabled: g("pc.enabled"), installOk: g("pc.install_ok"),
      skills: Number(g("pc.skills_count") || 0), agentsN: Number(g("pc.agents_count") || 0), commands: Number(g("pc.commands_count") || 0) });
  }
  return ev;
}
// One JSON line -> events. Accepts single records (local queue / logs) and OTLP envelopes
// ({"resourceLogs":[...]} lines, e.g. the collector file exporter: infra/local/data/telemetry.jsonl).
function normalizeLine(o) {
  if (o && Array.isArray(o.resourceLogs)) {
    const out = [];
    for (const rl of o.resourceLogs) for (const sl of (rl.scopeLogs || [])) for (const r of (sl.logRecords || [])) {
      const ev = normalizeRecord(r); if (ev) out.push(ev);
    }
    return out;
  }
  const ev = normalizeRecord(o);
  return ev ? [ev] : [];
}
function lc(v) { return v ? String(v).toLowerCase() : null; }

function parseLines(text) {
  const lines = String(text).split(/\r?\n/);
  const events = []; let skipped = 0;
  for (let line of lines) {
    if (!line) continue;
    line = line.replace(/^﻿/, "").trim();
    if (!line) continue;
    let o; try { o = JSON.parse(line); } catch (_) { skipped++; continue; }
    const evs = normalizeLine(o);
    if (evs.length) { for (const ev of evs) events.push(ev); } else skipped++;
  }
  return { events, total: lines.length, skipped };
}

async function parseLinesBatched(text, onProgress) {
  const lines = String(text).split(/\r?\n/);
  const events = []; let skipped = 0;
  const N = lines.length, CHUNK = 5000;
  for (let i = 0; i < N; i += CHUNK) {
    const end = Math.min(i + CHUNK, N);
    for (let j = i; j < end; j++) {
      let line = lines[j];
      if (!line) continue;
      line = line.replace(/^﻿/, "").trim();
      if (!line) continue;
      let o; try { o = JSON.parse(line); } catch (_) { skipped++; continue; }
      const evs = normalizeLine(o);
      if (evs.length) { for (const ev of evs) events.push(ev); } else skipped++;
    }
    if (onProgress) onProgress(end / N);
    await new Promise(r => setTimeout(r, 0));
  }
  return { events, total: N, skipped };
}

// ---------- Aggregation ----------
function aggregate(events) {
  const hasLogPolicy = events.some(e => e.type === "policy" && e.origin === "log");
  const policy = events.filter(e => e.type === "policy" && (hasLogPolicy ? e.origin === "log" : true));
  const hasLogErr = events.some(e => e.type === "error" && e.origin === "log");
  const errors = events.filter(e => e.type === "error" && (hasLogErr ? e.origin === "log" : true));
  const skills = events.filter(e => e.type === "skill");

  const sev = { critical: 0, high: 0, medium: 0, other: 0 };
  policy.forEach(e => { const s = e.severity || "other"; if (sev[s] === undefined) sev.other++; else sev[s]++; });

  const ruleMap = {};
  policy.forEach(e => {
    const k = e.rule || "(unknown)";
    const r = ruleMap[k] || (ruleMap[k] = { rule: k, severity: e.severity || "", block: 0, warn: 0, total: 0 });
    if (e.action === "block") r.block++; else if (e.action === "warn") r.warn++;
    r.total++; if (!r.severity && e.severity) r.severity = e.severity;
  });
  const rules = Object.values(ruleMap).sort((a, b) => b.total - a.total);
  const action = { block: 0, warn: 0 };
  policy.forEach(e => { if (e.action === "block") action.block++; else if (e.action === "warn") action.warn++; });

  const skillMap = {};
  skills.forEach(e => {
    const kind = e.kind || "skill";
    const name = e.skill || "(unknown)";
    const plugin = e.plugin || "";
    const key = kind + "|" + name + "|" + plugin;
    const s = skillMap[key] || (skillMap[key] = { name, kind, plugin, source: e.source || "unknown", count: 0 });
    s.count++;
  });
  const skillRows = Object.values(skillMap).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  const bySource = {}, byKind = {};
  skills.forEach(e => {
    const src = e.source || "unknown"; bySource[src] = (bySource[src] || 0) + 1;
    const k = e.kind || "skill"; byKind[k] = (byKind[k] || 0) + 1;
  });

  const errMap = {};
  errors.forEach(e => { const key = (e.error || "(unknown error)") + "␀" + (e.agent || "?"); errMap[key] = (errMap[key] || 0) + 1; });
  const errRows = Object.entries(errMap).map(([k, c]) => {
    const [msg, agent] = k.split("␀"); return { error: msg, agent, count: c };
  }).sort((a, b) => b.count - a.count);

  // Inventory: latest snapshot per user+client, then one row per plugin+client (users, versions in the field)
  const latest = {};
  events.filter(e => e.type === "inventory").forEach(e => {
    const k = e.user + "|" + (e.client || "");
    const t = e.ts ? Date.parse(e.ts) : 0;
    if (!latest[k] || t > latest[k].t) latest[k] = { t, snapshot: e.snapshot, recs: [] };
    if (latest[k].snapshot === e.snapshot) latest[k].recs.push(e);
  });
  const invMap = {}; const invUsers = new Set();
  Object.values(latest).forEach(l => l.recs.forEach(e => {
    invUsers.add(e.user);
    const plugin = e.plugin || "(personal)";
    const key = plugin + "|" + (e.client || "");
    const r = invMap[key] || (invMap[key] = { plugin, client: e.client || "", source: e.source || "unknown",
      users: new Set(), versions: new Set(), skills: 0, agents: 0, commands: 0, broken: 0 });
    r.users.add(e.user);
    if (e.pluginVersion) r.versions.add(e.pluginVersion);
    r.skills = Math.max(r.skills, e.skills); r.agents = Math.max(r.agents, e.agentsN); r.commands = Math.max(r.commands, e.commands);
    if (e.installOk === "false") r.broken++;
  }));
  const invRows = Object.values(invMap).sort((a, b) => b.users.size - a.users.size || a.plugin.localeCompare(b.plugin));

  const all = policy.concat(skills, errors);
  // Compute min/max with a loop (Math.min(...arr) overflows the stack on large files).
  let tMin = Infinity, tMax = -Infinity, haveTime = false;
  const agentSet = new Set();
  for (const e of all) {
    if (e.agent) agentSet.add(e.agent);
    if (e.ts) { const t = Date.parse(e.ts); if (!isNaN(t)) { haveTime = true; if (t < tMin) tMin = t; if (t > tMax) tMax = t; } }
  }
  return {
    total: all.length, policyCount: policy.length, skillCount: skills.length, errorCount: errors.length,
    range: haveTime ? { min: new Date(tMin), max: new Date(tMax) } : null,
    agents: [...agentSet], sev, rules, action, skillRows, bySource, byKind, errRows,
    invRows, invUsers: invUsers.size
  };
}

// ---------- Rendering ----------
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtDate(d) { return d ? d.toISOString().replace("T", " ").slice(0, 19) + "Z" : "—"; }

function render(input, meta) {
  const events = typeof input === "string" ? parseLines(input).events : input;
  const a = aggregate(events);
  paint(a, meta || {});
  return a;
}

function paint(a, meta) {
  const c = document.getElementById("content");
  if (a.total === 0 && a.invRows.length === 0) {
    c.innerHTML = '<div class="empty">No recognizable telemetry in the loaded file(s).</div>';
    return;
  }
  const sevMax = Math.max(1, a.sev.critical, a.sev.high, a.sev.medium, a.sev.other);
  const sevBar = (name, key) => {
    const n = a.sev[key];
    return `<div class="sevrow"><div class="lbl">${name}</div>
      <div class="track s-${key}"><span style="width:${(n / sevMax * 100).toFixed(1)}%"></span></div>
      <div class="num">${n}</div></div>`;
  };

  const skillMax = a.skillRows.length ? a.skillRows[0].count : 1;
  const skillRowsHtml = a.skillRows.map(s => `
    <tr>
      <td class="barcell"><span class="b" style="width:${(s.count / skillMax * 100).toFixed(1)}%"></span>
        <span class="t"><strong>${esc(s.name)}</strong></span></td>
      <td><span class="pill ${s.kind === "agent" || s.kind === "command" ? s.kind : "skill"}">${esc(s.kind)}</span></td>
      <td>${s.plugin ? esc(s.plugin) : ""}</td>
      <td><span class="pill ${esc(s.source)}">${esc(s.source)}</span></td>
      <td class="num">${s.count}</td>
    </tr>`).join("");

  const ruleRowsHtml = a.rules.map(r => `
    <tr>
      <td><strong>${esc(r.rule)}</strong></td>
      <td><span class="pill s-${r.severity}">${esc(r.severity || "—")}</span></td>
      <td class="num">${r.block || ""}</td>
      <td class="num">${r.warn || ""}</td>
      <td class="num">${r.total}</td>
    </tr>`).join("");

  const chip = (label, n) => `<span class="chip">${esc(label)} <b>${n}</b></span>`;
  const sourceChips = Object.entries(a.bySource).sort((x, y) => y[1] - x[1]).map(([k, v]) => chip(k, v)).join("");
  const kindChips = Object.entries(a.byKind).sort((x, y) => y[1] - x[1]).map(([k, v]) => chip(k, v)).join("");

  let html = "";

  // Summary tiles
  const range = a.range ? `${fmtDate(a.range.min)} <span class="muted">to</span> ${fmtDate(a.range.max)}` : "None";
  html += `<div class="tiles">
    <div class="tile"><div class="k">Events</div><div class="v">${a.total}</div></div>
    <div class="tile"><div class="k">Policy findings</div><div class="v">${a.policyCount}</div></div>
    <div class="tile"><div class="k">Skill / agent uses</div><div class="v">${a.skillCount}</div></div>
    <div class="tile"><div class="k">Hook errors</div><div class="v">${a.errorCount}</div></div>
    <div class="tile"><div class="k">Agents</div><div class="v small">${a.agents.length ? esc(a.agents.join(", ")) : "None"}</div></div>
  </div>`;
  html += `<div class="sub" style="margin:2px 2px 0">Range: ${range}` +
    (meta.files ? `, Files: ${esc(meta.files.join(", "))}` : "") +
    (meta.skipped ? `, <span class="muted">${meta.skipped} line(s) skipped</span>` : "") + `</div>`;

  // Policy panel
  if (a.policyCount > 0) {
    html += `<section class="panel"><h2>Policy findings by severity <span class="count">${a.policyCount} total, ${a.action.block} blocked, ${a.action.warn} warned</span></h2>
      ${sevBar("critical", "critical")}${sevBar("high", "high")}${sevBar("medium", "medium")}${a.sev.other ? sevBar("other", "other") : ""}
      <div class="tblwrap" style="margin-top:12px"><table>
        <thead><tr><th>Rule</th><th>Severity</th><th class="num">Block</th><th class="num">Warn</th><th class="num">Total</th></tr></thead>
        <tbody>${ruleRowsHtml}</tbody></table></div>
    </section>`;
  }

  // Skills panel
  if (a.skillCount > 0) {
    html += `<section class="panel"><h2>Skills &amp; agents by usage <span class="count">${a.skillRows.length} distinct, ${a.skillCount} uses</span></h2>
      <div class="chips">${sourceChips}${kindChips}</div>
      <div class="tblwrap"><table>
        <thead><tr><th>Name</th><th>Type</th><th>Plugin</th><th>Source</th><th class="num">Uses</th></tr></thead>
        <tbody>${skillRowsHtml}</tbody></table></div>
    </section>`;
  }

  // Inventory panel
  if (a.invRows.length > 0) {
    const invRowsHtml = a.invRows.map(r => `
      <tr>
        <td><strong>${esc(r.plugin)}</strong>${r.broken ? ` <span class="muted">(${r.broken} broken install)</span>` : ""}</td>
        <td>${esc(r.client)}</td>
        <td><span class="pill ${esc(r.source)}">${esc(r.source)}</span></td>
        <td>${esc([...r.versions].sort().join(", "))}</td>
        <td class="num">${r.skills}</td><td class="num">${r.agents}</td><td class="num">${r.commands}</td>
        <td class="num">${r.users.size}</td>
      </tr>`).join("");
    html += `<section class="panel"><h2>Installed (latest inventory per user) <span class="count">${a.invRows.length} plugins, ${a.invUsers} user(s)</span></h2>
      <div class="tblwrap"><table>
        <thead><tr><th>Plugin</th><th>Client</th><th>Source</th><th>Versions</th><th class="num">Skills</th><th class="num">Agents</th><th class="num">Commands</th><th class="num">Users</th></tr></thead>
        <tbody>${invRowsHtml}</tbody></table></div>
    </section>`;
  }

  // Errors panel
  if (a.errorCount > 0) {
    const errRowsHtml = a.errRows.map(e => `<tr><td>${esc(e.error)}</td><td>${esc(e.agent)}</td><td class="num">${e.count}</td></tr>`).join("");
    html += `<section class="panel"><h2>Hook errors <span class="count">${a.errorCount} total</span></h2>
      <div class="tblwrap"><table>
        <thead><tr><th>Error</th><th>Agent</th><th class="num">Count</th></tr></thead>
        <tbody>${errRowsHtml}</tbody></table></div>
    </section>`;
  }

  c.innerHTML = html;
}

// ---------- File loading (with progress) ----------
function readFileWithProgress(file, onProgress) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    r.onload = () => { if (onProgress) onProgress(1); resolve(String(r.result || "")); };
    r.onerror = () => reject(r.error);
    r.readAsText(file);
  });
}

const progWrap = document.getElementById("progressWrap");
const progBar = document.getElementById("progressBar");
const progMsg = document.getElementById("progressMsg");
function setProgress(frac, msg) { progBar.style.width = (Math.max(0, Math.min(1, frac)) * 100).toFixed(1) + "%"; if (msg) progMsg.textContent = msg; }
function showProgress() { progWrap.classList.add("on"); setProgress(0, ""); }
function hideProgress() { progWrap.classList.remove("on"); }

async function loadFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  showProgress();
  let allEvents = [], totalLines = 0, skipped = 0; const names = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i]; names.push(f.name);
    const text = await readFileWithProgress(f, frac => setProgress((i + frac * 0.5) / files.length, "Reading " + f.name + " …"));
    const res = await parseLinesBatched(text, frac => setProgress((i + 0.5 + frac * 0.5) / files.length, "Processing " + f.name + " … " + Math.round(frac * 100) + "%"));
    allEvents = allEvents.concat(res.events); totalLines += res.total; skipped += res.skipped;
  }
  setProgress(1, "Done · " + allEvents.length + " events, " + skipped + " skipped");
  setTimeout(hideProgress, 400);
  render(allEvents, { files: names, totalLines, skipped });
}

// ---------- Wiring ----------
const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
fileInput.addEventListener("change", e => loadFiles(e.target.files));
["dragenter", "dragover"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave", "drop"].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if (ev === "drop" || e.target === document || e.relatedTarget === null) drop.classList.remove("drag"); }));
document.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("drag"); if (e.dataTransfer && e.dataTransfer.files) loadFiles(e.dataTransfer.files); });

// Expose pure logic for tests / injection
window.Hodor = { parseLines, parseLinesBatched, normalizeRecord, aggregate, render };
</script>
